{% comment %}
  Digital art slot. Shows nothing if src is blank.
  Usage in a page:  include art.html src=page.art_hero alt="Description"
{% endcomment %}
{% if include.src and include.src != "" %}
  <figure class="art {{ include.class }}">
    <img src="{{ include.src | relative_url }}" alt="{{ include.alt }}" loading="lazy">
  </figure>
{% endif %}
