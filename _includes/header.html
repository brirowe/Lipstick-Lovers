<header class="site-header">
  <a class="brand" href="{{ '/' | relative_url }}">
    <span class="brand-name">{{ site.title }}</span>
    {% if site.logo != "" and site.logo %}
      <img class="logo" src="{{ site.logo | relative_url }}" alt="{{ site.title }} logo">
    {% else %}
      <span class="logo logo-placeholder" title="Set `logo` in _config.yml">Logo</span>
    {% endif %}
  </a>

  <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <nav class="site-nav" aria-label="Main">
    {% for item in site.data.navigation %}
      <a href="{{ item.url | relative_url }}" {% if page.url == item.url %}class="active" aria-current="page"{% endif %}>{{ item.title }}</a>
    {% endfor %}
  </nav>
</header>
<div class="pride-stripe" aria-hidden="true"></div>
