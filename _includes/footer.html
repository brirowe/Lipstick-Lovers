<footer class="site-footer">
  <div class="pride-stripe" aria-hidden="true"></div>
  <p>
    {{ site.title }} &middot; {{ site.tagline }}
    {% if site.social.instagram != "" and site.social.instagram %}&middot; <a href="{{ site.social.instagram }}">Instagram</a>{% endif %}
  </p>
</footer>

<!-- Soccer ball back-to-top button -->
<button class="to-top" aria-label="Back to top" title="Back to top">
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <circle cx="32" cy="32" r="29" fill="#fff" stroke="#111" stroke-width="3"/>
    <polygon points="32,20 43,28 39,41 25,41 21,28" fill="#111"/>
    <path d="M32 20 V5 M43 28 L57 23 M39 41 L48 54 M25 41 L16 54 M21 28 L7 23" stroke="#111" stroke-width="3" fill="none"/>
    <polygon points="24,5 40,5 32,11" fill="#111"/>
    <polygon points="59,30 56,44 52,33" fill="#111"/>
    <polygon points="5,30 8,44 12,33" fill="#111"/>
    <polygon points="22,61 42,61 32,56" fill="#111"/>
  </svg>
  <span>Top</span>
</button>
