<footer class="site-footer">
  <div class="pride-stripe" aria-hidden="true"></div>
  <p>
    {{ site.title }} &middot; {{ site.tagline }}
    {% if site.social.instagram != "" and site.social.instagram %}&middot; <a href="{{ site.social.instagram }}">Instagram</a>{% endif %}
  </p>
</footer>
