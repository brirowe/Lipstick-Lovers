<footer class="site-footer">
  <div class="pride-stripe" aria-hidden="true"></div>
  <p>
    {{ site.title }} &middot; {{ site.tagline }}
    {% if site.social.instagram != "" and site.social.instagram %}&middot; <a href="{{ site.social.instagram }}">Instagram</a>{% endif %}
  </p>
</footer>

<!-- Soccer ball back-to-top button -->
<button class="to-top" aria-label="Back to top" title="Back to top">
  <img src="{{ '/assets/img/soccer-ball.png' | relative_url }}" alt="" width="46" height="46">
  <span>Top</span>
</button>
