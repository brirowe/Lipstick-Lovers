# Resources page.
# Each card has a title, an optional blurb, and a list of items.
# Each item is a dropdown: name (what shows when closed), details (bullet points), links.
# details and links are both optional.

- title: "Local Mental Health Resources"
  blurb: "Denver-area support."
  items:
    - name: "Yarrow Collective"
      details:
        - "Colorado-based organization offering non-carceral, consent-based services of peer support, recovery, and harm reduction, by/for/with people with lived experience."
      links:
        - name: "Website"
          url: "https://www.yarrowcollective.org/"
        - name: "@yarrowcollectivecolorado"
          url: "https://www.instagram.com/yarrowcollectivecolorado"
    - name: "Queer Asterisk"
      details:
        - "Denver-based therapy and mental health organization by and for queer people."
      links:
        - name: "Website"
          url: "https://www.queerasterisk.com/"
        - name: "@queerasterisk"
          url: "https://www.instagram.com/queerasterisk"
    - name: "Chroma Wellness Center"
      details:
        - "Denver-based long-term LGBTQIA+ mental health and recovery center offering expert care and a true sense of belonging."
      links:
        - name: "Website"
          url: "https://www.chromawellnesscenter.com/"
        - name: "@chromawellnesscenter"
          url: "https://www.instagram.com/chromawellnesscenter"
    - name: "The Center on Colfax"
      details:
        - "Offers 12 free sessions, in person or virtual."
        - "There's a bit of a waitlist right now, usually no more than 4 to 6 weeks. Fill out the intake form to be contacted for a quick intake process."
      links:
        - name: "Intake form"
          url: "https://lgbtqcolorado.org/programs/glass-lawler-mental-health/"
        - name: "Website"
          url: "https://lgbtqcolorado.org"
        - name: "@centeroncolfax"
          url: "https://www.instagram.com/CenterOnColfax/"

- title: "National Lifelines / Helplines"
  blurb: "These are helplines. If you're experiencing an emergency, call 911."
  items:
    - name: "988 Helpline"
      details:
        - "Call, chat, or text 988. Help available 24/7, in Spanish and in English."
      links:
        - name: "Website"
          url: "https://988lifeline.org/"
    - name: "Trans Lifeline"
      details:
        - "(877) 565-8860"
        - "Peer support phone service run by trans people for trans and questioning peers. Call if you need someone trans to talk to, even if you're not in a crisis or if you're not sure you're trans."
        - "Available 11AM-7PM MST, Monday-Friday."
      links:
        - name: "Website"
          url: "https://translifeline.org"
    - name: "Thrive Lifeline"
      details:
        - "Non-carceral support by and for multiply marginalized communities."
        - "Wednesday night to Thursday morning, 10:30pm-4:30am Pacific Time."
      links:
        - name: "Website"
          url: "https://thrivelifeline.org"

- title: "Therapy Resources"
  blurb: "Queer and trans affirming therapy."
  items:
    - name: "iAmClinic"
      details:
        - "Denver-based LGBTQ therapy."
        - "Call or text (720) 551-8382."
      links:
        - name: "Website"
          url: "https://www.iamclinic.org/home-2026/"
        - name: "@lgbtq_therapy"
          url: "https://www.instagram.com/lgbtq_therapy/"
    - name: "Spark Change"
      details:
        - "Offers 10 free sessions, in person or virtual."
        - "They are currently experiencing high demand for services. Expect an approximate 3-week wait before receiving services."
      links:
        - name: "Intake form"
          url: "https://projecthelping.notion.site/1f1a5b84107e8049b3badb96de109638"
        - name: "Website"
          url: "https://sparkchange.org/mentalwellness/"
    - name: "Liberated Relating"
      details:
        - "Therapy centering Trans/Queer/Non-Monogamous/Kinky folks."
        - "Takes all major insurance and offers sliding scale."
      links:
        - name: "Website"
          url: "http://www.liberated-relating.ink"
    - name: "Rooted Acorn Counseling"
      details:
        - "Queer-founded and queer-led therapy practice, offering queer and trans affirming individual and relationship therapy."
        - "Offers sliding scale/reduced rate options."
      links:
        - name: "Website"
          url: "https://www.rootedacorncounseling.com/"
        - name: "@rootedacorncounseling"
          url: "https://www.instagram.com/rootedacorncounseling"
    - name: "Cairn Counseling"
      details:
        - "Queer-founded and queer-led therapy practice offering queer and trans affirming individual and couples therapy."
        - "Accepts Medicaid and many private insurances."
        - "Virtual and in person available."
        - "Offers sliding scale/reduced rate options."
      links:
        - name: "Website"
          url: "https://www.cairncounselingdenver.com/"

