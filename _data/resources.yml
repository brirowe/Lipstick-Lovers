- title: "Soccer 101"
  blurb: "New to soccer? Start here."
  items:
    - name: "How we play: 7v7"
      details:
        - "We usually play 7v7: 6 players on the field plus 1 goalie per team."
        - "Team sizes can vary depending on field availability and player attendance."
        - "We don't play offsides."
    - name: "Warm-up routine"
      details:
        - "Warm up before every game. Johns Hopkins has a simple routine to follow."
      links:
        - name: "Soccer warm-ups (Johns Hopkins)"
          url: "https://www.hopkinsmedicine.org/health/expert-qa/soccer-warmups-to-prepare-for-your-game"