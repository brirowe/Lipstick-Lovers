- text: "We are here to play soccer joyfully and safely."
- text: "We are here to build community with one another."
- text: "We don't slide tackle, use our arms, or body check each other. If someone seems hurt, we pause play and check in."
- text: "If we're experiencing a problem, we talk directly to the people involved."
- text: "We are aware of our bodies, how they affect others, and what they need."
- text: "We are here to have fun, play soccer, look out for each other, and be queer."