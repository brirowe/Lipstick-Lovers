# Registration form answer choices. Edit these each season.
# Team names, spot caps, colors, and descriptions live in the "Teams" tab
# of the Google Sheet, not here.
# Community agreements on the form come from _data/agreements.yml (same as the About page).

# ----- Payment -----
season_cost: 50          # full season price in dollars
payment_tiers: [0, 50, 100, 150]   # percent of season cost
venmo_handle: "@username"          # who to send Venmo payments to (PLACEHOLDER)
cash_note: "Bring cash to your first game."   # shown when someone picks Cash (PLACEHOLDER)

# Lowest to highest. "name" is what gets saved to the Sheet.
levels:
  - name: "Recreational"
    description: "New to soccer or very little experience"
  - name: "Beginner"
    description: "Played a little, (like pickup, casual rec, or as a kid)"
  - name: "Intermediate"
    description: "Played regularly, like high school, club, or several seasons of adult league"
  - name: "Advanced"
    description: "Played in college or in a highly competitive adult league"

# People can pick more than one
positions:
  - "Goalkeeper"
  - "Defense"
  - "Midfielder"
  - "Forward"
  - "Anywhere"

sub_note: "While we love our subs... subbing doesn't mean guaranteed playing time. Please be respectful of the players who are on a given team roster. That said, we'd love to have you participate as much as you want!"
sub_options:
  - "Not interested in subbing"
  - "I'd like to sub occasionally"
  - "I'd like to sub every week"

# One line per game. These show as checkboxes.
games:
  # PLACEHOLDERS: swap in real dates/times when the schedule is set
  - "Sun, Dec 6 (evening)"
  - "Sun, Dec 13 (evening)"
  - "Sun, Dec 20 (evening)"
  - "Sun, Dec 27 (evening)"
  - "Sun, Jan 3 (evening)"
  - "Sun, Jan 10 (evening)"
  - "Sun, Jan 17 (evening)"
  - "Sun, Jan 24 (evening)"

# Sample teams shown while registration is closed (preview mode)
preview_teams:
  - { name: "ACAB FC",         color: "#000000" }
  - { name: "Cleated Rivalry", color: "#c3a6ff" }
  - { name: "Hot to Goal!",    color: "#ff8c1a" }
  - { name: "Kicks & Giggles", color: "#1a3dff" }
  - { name: "Oat Milk",        color: "#5bcefa" }
  - { name: "Pink Pony Club",  color: "#ff5cb8" }
  - { name: "Scissor Kickers", color: "#2ed15b" }
  - { name: "Uhaul United",    color: "#ff3b3b" }

# Media disclaimer on the registration form (one bullet per line)
media_disclaimer:
  - "Players and organizers take photos and videos throughout the season, and some may end up on our social media. People aren't tagged."
  - "Please check in with each other before taking pictures, and feel free to opt out of group photos. It's absolutely okay to not want to be in them!"
  - "Don't want to be on our social media at all? Contact us through the website and we'll do our best to accommodate. Thank you!"
