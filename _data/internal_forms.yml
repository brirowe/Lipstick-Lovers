# Text and answer choices for the internal (link-only) forms.
# The _es lines are the Spanish versions. Answers always save in English.
# Feedback page: /season-feedback-k7q2/   Volunteer page: /volunteer-m4x8/

feedback:
  season: "Fall 2026"   # update each season, saved with every response
  intro: "While we're all volunteers who help with the logistics of this league, we'd love to hear your feedback! Tell us what worked and what didn't. We'll start with what comes up most! Anonymous is totally fine."
  intro_es: "Todas las personas que ayudamos con la logística de esta liga somos voluntarias, ¡y nos encantaría saber tu opinión! Cuéntanos qué funcionó y qué no. Empezaremos por lo que más se repita. Puede ser anónimo."
  ratings: ["1", "2", "3", "4", "5"]

volunteer:
  intro: "Not a captain but want to help? Seasons are about 8 weeks."
  intro_es: "¿No eres parte del equipo de capitanes pero quieres ayudar? Las temporadas duran unas 8 semanas."
  time_options:
    - "One-time thing"
    - "About 1 hour a week"
    - "2+ hours a week"
  # Spanish versions, same order as above
  time_options_es:
    - "Solo una vez"
    - "Como 1 hora a la semana"
    - "2 horas o más a la semana"
  areas:
    - "Community events"
    - "Art and design"
    - "Fundraising"
    - "End of season tournament"
    - "Wherever help is needed"
    - "Other"
  # Spanish versions, same order as above
  areas_es:
    - "Eventos comunitarios"
    - "Arte y diseño"
    - "Recaudación de fondos"
    - "Torneo de fin de temporada"
    - "Donde se necesite ayuda"
    - "Otro"
